<section class="wrap"><form class="box" action="login.html"><h2>Create account</h2><p class="mute">Join PixelNest in under a minute.</p>
<label for="u">Username</label><input id="u" name="username" required>
<div class="row"><div><label for="f">Firstname</label><input id="f" name="firstname" required></div><div><label for="l">Lastname</label><input id="l" name="lastname" required></div></div>
<label for="p">Password</label><input id="p" type="password" name="password" minlength="6" required>
<label for="c">Confirm password</label><input id="c" type="password" name="confirm" minlength="6" required>
<label for="e">Email</label><input id="e" type="email" name="email" required>
<button class="btn full">Create account</button><p class="mute center">Already registered? <a class="lnk" href="login.html">Log in</a></p></form></section>
